name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dags:
    name: DAG integrity tests
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "3.4.0"
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      GRIDPULSE_HOME: ${{ github.workspace }}/spain-grid-pulse
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jonathantorresdata/spain-grid-pulse
          path: spain-grid-pulse
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Airflow with its constraints, then the pipeline
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.12.txt"
          pip install -r requirements.txt pytest ./spain-grid-pulse
      - run: airflow db migrate
      - run: python -m pytest -q tests
