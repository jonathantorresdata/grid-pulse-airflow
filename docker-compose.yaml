# Local Airflow: Postgres metadata database + API server, scheduler, DAG processor and triggerer
# (LocalExecutor). Expects a checkout of spain-grid-pulse next to this repository.
#
#   git clone https://github.com/jonathantorresdata/spain-grid-pulse.git ../spain-grid-pulse
#   docker compose up --build
#   open http://localhost:8080  (user: airflow / password: airflow)

x-airflow-common: &airflow-common
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Madrid
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    GRIDPULSE_HOME: /opt/airflow/spain-grid-pulse
    PYTHONPATH: /opt/airflow/spain-grid-pulse:/opt/airflow
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./passwords.json:/opt/airflow/passwords.json
    - ../spain-grid-pulse:/opt/airflow/spain-grid-pulse
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: db migrate

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["8080:8080"]
    depends_on: { airflow-init: { condition: service_completed_successfully } }

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on: { airflow-init: { condition: service_completed_successfully } }

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on: { airflow-init: { condition: service_completed_successfully } }

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on: { airflow-init: { condition: service_completed_successfully } }
